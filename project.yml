# Generates Minits.xcodeproj. On your Mac:
#   brew install xcodegen
#   xcodegen
#   open Minits.xcodeproj
name: Minits

options:
  bundleIdPrefix: com.jsonify
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    minorVersion: 0.18.0

targets:
  Minits:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Minits
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: FluidAudio
    info:
      path: Minits/Info.plist
      properties:
        CFBundleDisplayName: Minits
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Minits records your board meeting and each member's voice sample on this device so it can tell who is speaking.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits
        PRODUCT_NAME: Minits
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Pick your Apple ID team in Xcode > Signing & Capabilities (a free Apple ID works).
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Minits/Minits-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
