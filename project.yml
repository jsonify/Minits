# Generates Minits.xcodeproj. On your Mac:
#   brew install xcodegen
#   xcodegen
#   open Minits.xcodeproj
name: Minits

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    minorVersion: 0.18.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    minorVersion: 1.5.0
  # The SK-1 look (tokens and SwiftUI components), shared with Skreener.
  SK1Kit:
    url: https://github.com/jsonify/SK1Kit.git
    from: 0.3.0

targets:
  Minits:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Minits
        excludes:
          - "**/*.entitlements"
          - "Eval/**"            # evaluation code ships in the eval tool and tests, not the app
    dependencies:
      - package: FluidAudio
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
      # The recording's Live Activity (iPhone only).
      - target: MinitsRecordingWidget
        embed: true
        destinationFilters: [iOS]
    info:
      path: Minits/Info.plist
      properties:
        CFBundleDisplayName: Minits
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Minits records your board meeting and each member's voice sample on this device so it can tell who is speaking.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    # Bundle ID and team come from Config/Signing.xcconfig, which includes your gitignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Minits
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Minits/Minits-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  # The recording's Live Activity on the lock screen and in the Dynamic Island (iPhone). Embedded in the app on iOS.
  # Its bundle ID is the app's plus ".recording", so a Config/Local.xcconfig bundle ID carries over to it.
  MinitsRecordingWidget:
    type: app-extension
    platform: iOS
    sources:
      - MinitsRecordingWidget
      - Minits/LiveActivity/RecordingActivity.swift
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: MinitsRecordingWidget/Info.plist
      properties:
        CFBundleDisplayName: Minits
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # $(inherited) here is the app's bundle ID from Signing.xcconfig (or your Local.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).recording
        PRODUCT_NAME: MinitsRecordingWidget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Unit tests for the evaluation scorer. Compiles Minits/Eval directly (no app host, no FluidAudio),
  # so they run fast on a Mac: xcodebuild test -scheme MinitsEvalTests -destination 'platform=macOS'
  MinitsEvalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MinitsEvalTests
      - Minits/Eval
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.evaltests

  # Tests for Minits/Voice (VoiceEngine, VoiceTuning) and Minits/Minutes (outline fallback). Compiles against FluidAudio, so these are
  # slower than MinitsEvalTests and the snapshot test needs FluidAudio's models downloaded once:
  # xcodebuild test -scheme MinitsTests -destination 'platform=macOS'
  MinitsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MinitsTests
      - Minits/Voice
      - Minits/Minutes
      - Minits/Models
    dependencies:
      - package: FluidAudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.tests

  # Screenshots of every screen in light and dark at iPhone and wide widths (Tests/MinitsScreenTests). Runs inside
  # the app on the iOS Simulator (UIKit draws the text fields and scroll views that ImageRenderer can't); no models
  # or mic needed: xcodebuild test -scheme MinitsScreenTests -destination 'platform=iOS Simulator,name=iPhone 16'
  MinitsScreenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MinitsScreenTests
    dependencies:
      - target: Minits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.screentests

  # Command-line speaker eval: `minits-eval run eval/`, `label <session>`, `compare a.json b.json`.
  # Compiles VoiceEngine.swift and Minits/Eval directly, so the engine stays single-sourced with the app:
  # xcodebuild -scheme minits-eval build
  minits-eval:
    type: tool
    platform: macOS
    sources:
      - Tools/minits-eval
      - Minits/Eval
      - Minits/Voice/VoiceEngine.swift
    dependencies:
      - package: FluidAudio
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.eval
