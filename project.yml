# Generates Minits.xcodeproj. On your Mac:
#   brew install xcodegen
#   xcodegen
#   open Minits.xcodeproj
name: Minits

options:
  bundleIdPrefix: com.jsonify
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    minorVersion: 0.18.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    minorVersion: 1.5.0

targets:
  Minits:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Minits
        excludes:
          - "**/*.entitlements"
          - "Eval/**"            # evaluation code ships in the eval tool and tests, not the app
    dependencies:
      - package: FluidAudio
    info:
      path: Minits/Info.plist
      properties:
        CFBundleDisplayName: Minits
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Minits records your board meeting and each member's voice sample on this device so it can tell who is speaking.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits
        PRODUCT_NAME: Minits
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Pick your Apple ID team in Xcode > Signing & Capabilities (a free Apple ID works).
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Minits/Minits-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  # Unit tests for the evaluation scorer. Compiles Minits/Eval directly (no app host, no FluidAudio),
  # so they run fast on a Mac: xcodebuild test -scheme MinitsEvalTests -destination 'platform=macOS'
  MinitsEvalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MinitsEvalTests
      - Minits/Eval
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.evaltests

  # Tests for Minits/Voice (VoiceEngine, VoiceTuning). Compiles against FluidAudio, so these are
  # slower than MinitsEvalTests and the snapshot test needs FluidAudio's models downloaded once:
  # xcodebuild test -scheme MinitsTests -destination 'platform=macOS'
  MinitsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MinitsTests
      - Minits/Voice
    dependencies:
      - package: FluidAudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.tests

  # Command-line speaker eval: `minits-eval run eval/`, `label <session>`, `compare a.json b.json`.
  # Compiles VoiceEngine.swift and Minits/Eval directly, so the engine stays single-sourced with the app:
  # xcodebuild -scheme minits-eval build
  minits-eval:
    type: tool
    platform: macOS
    sources:
      - Tools/minits-eval
      - Minits/Eval
      - Minits/Voice/VoiceEngine.swift
    dependencies:
      - package: FluidAudio
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.minits.eval
